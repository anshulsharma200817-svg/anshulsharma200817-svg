<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 140" width="100%" height="100%">
  <defs>
    <style type="text/css">
      @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&amp;family=Fira+Code:wght@400;500&amp;display=swap');
      
      .status-card {
        font-family: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
      }
      
      .mono-text {
        font-family: 'Fira Code', monospace;
      }

      .glow-neon-blue {
        filter: drop-shadow(0 0 3px #00f2fe) drop-shadow(0 0 6px rgba(0, 242, 254, 0.2));
      }
      
      @keyframes scan-line {
        0% { transform: translateY(0); opacity: 0; }
        5% { opacity: 0.8; }
        95% { opacity: 0.8; }
        100% { transform: translateY(130px); opacity: 0; }
      }

      .scanner-line {
        animation: scan-line 6s linear infinite;
      }
      
      @keyframes flame-pulse {
        0%, 100% { transform: scale(1); opacity: 0.8; }
        50% { transform: scale(1.15); opacity: 1; }
      }
      
      .flame {
        transform-origin: 618px 42px;
        animation: flame-pulse 2s ease-in-out infinite;
      }
    </style>
    
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#0e1322" stroke-width="0.8" />
    </pattern>

    <linearGradient id="card-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#04060c" />
      <stop offset="100%" stop-color="#080c16" />
    </linearGradient>

    <filter id="scan-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="850" height="140" rx="2" fill="url(#card-bg)" stroke="#1e293b" stroke-width="1.5" />
  <rect width="850" height="140" rx="0" fill="url(#grid)" />
  
  <rect x="6" y="6" width="838" height="128" fill="none" stroke="#1e293b" stroke-width="1" />
  <line x1="7" y1="7" x2="843" y2="7" stroke="#00f2fe" stroke-width="1.5" class="scanner-line" filter="url(#scan-glow)" />

  <g class="status-card">
    <!-- Left Panel: Core Stats -->
    <g transform="translate(20, 15)">
      <!-- Border Box -->
      <rect width="300" height="110" fill="#05070f" stroke="#1e293b" stroke-width="1" />
      <polygon points="2,2 8,2 2,8" fill="#00f2fe" />
      <polygon points="298,2 292,2 298,8" fill="#00f2fe" />
      <polygon points="2,108 8,108 2,102" fill="#00f2fe" />
      <polygon points="298,108 292,108 298,102" fill="#00f2fe" />
      
      <text x="15" y="20" font-size="11" font-weight="800" fill="#f1f5f9" letter-spacing="1.5">GITHUB LOGISTICS PROFILE</text>
      
      <!-- Stats Col 1 -->
      <text x="15" y="45" font-size="10" font-weight="600" fill="#475569">TOTAL COMMITS:</text>
      <text x="125" y="45" font-size="11" font-weight="700" fill="#3b82f6" class="mono-text">288</text>

      <text x="15" y="65" font-size="10" font-weight="600" fill="#475569">PULL REQUESTS:</text>
      <text x="125" y="65" font-size="11" font-weight="700" fill="#00f2fe" class="mono-text">56</text>

      <text x="15" y="85" font-size="10" font-weight="600" fill="#475569">TOTAL ISSUES:</text>
      <text x="125" y="85" font-size="11" font-weight="700" fill="#fb923c" class="mono-text">2</text>

      <!-- Stats Col 2 -->
      <text x="160" y="45" font-size="10" font-weight="600" fill="#475569">TOTAL STARS:</text>
      <text x="250" y="45" font-size="11" font-weight="700" fill="#eab308" class="mono-text">2</text>

      <text x="160" y="65" font-size="10" font-weight="600" fill="#475569">PUBLIC REPOS:</text>
      <text x="250" y="65" font-size="11" font-weight="700" fill="#a855f7" class="mono-text">20</text>

      <text x="160" y="85" font-size="10" font-weight="600" fill="#475569">FOLLOWERS:</text>
      <text x="250" y="85" font-size="11" font-weight="700" fill="#10b981" class="mono-text">6</text>
    </g>

    <!-- Right Section: Streak Metrics -->
    <!-- Card 1: Total Contributions -->
    <g transform="translate(340, 15)">
      <rect width="145" height="55" fill="#05070f" stroke="#1e293b" stroke-width="1" />
      <text x="15" y="20" font-size="8" font-weight="700" fill="#475569" letter-spacing="1">TOTAL CONTRIBUTIONS</text>
      <text x="15" y="42" font-size="20" font-weight="800" fill="#f1f5f9" class="mono-text">346</text>
    </g>

    <!-- Card 2: Current Streak -->
    <g transform="translate(500, 15)">
      <rect width="155" height="55" fill="#05070f" stroke="#1e293b" stroke-width="1" />
      <text x="15" y="20" font-size="8" font-weight="700" fill="#475569" letter-spacing="1">CURRENT STREAK</text>
      <text x="15" y="42" font-size="20" font-weight="800" fill="#00f2fe" class="mono-text">4</text>
      
      <!-- Flame Gauge Circle -->
      <circle cx="125" cy="28" r="9" fill="none" stroke="#1c2538" stroke-width="2" />
      <circle cx="125" cy="28" r="9" fill="none" stroke="#00f2fe" stroke-width="2" stroke-linecap="butt" stroke-dasharray="22.60 57" stroke-dashoffset="0" class="glow-neon-blue" />
      <!-- Tiny Flame SVG inside circle -->
      <path class="flame" d="M 125 22 C 122.5 25.5 122 28 123.5 31.5 C 125 33 126.5 32.5 127 30.5 C 127.5 28.5 126 26.5 125 22 Z" fill="#ff4500" />
    </g>

    <!-- Card 3: Longest Streak -->
    <g transform="translate(670, 15)">
      <rect width="160" height="55" fill="#05070f" stroke="#1e293b" stroke-width="1" />
      <text x="15" y="20" font-size="8" font-weight="700" fill="#475569" letter-spacing="1">LONGEST STREAK</text>
      <text x="15" y="42" font-size="20" font-weight="800" fill="#fb923c" class="mono-text">4</text>
      <text x="95" y="38" font-size="8" font-weight="700" fill="#10b981">DAYS PEAK</text>
    </g>

    <!-- Bottom Row: Recent Activity Sync -->
    <g transform="translate(0, 0)">
      <text x="340" y="93" font-size="9" font-weight="800" fill="#475569" letter-spacing="1.5">RECENT ACTIVITY SYNC (30 DAYS)</text>
      
      <!-- Grid Squares -->
      <rect x="340.0" y="103" width="9" height="9" rx="0" fill="#05070f" stroke="#1e293b" stroke-width="0.5" />
      <rect x="353.5" y="103" width="9" height="9" rx="0" fill="#0d5c75" stroke="#00f2fe" stroke-width="0.5" />
      <rect x="367.0" y="103" width="9" height="9" rx="0" fill="#05070f" stroke="#1e293b" stroke-width="0.5" />
      <rect x="380.5" y="103" width="9" height="9" rx="0" fill="#05070f" stroke="#1e293b" stroke-width="0.5" />
      <rect x="394.0" y="103" width="9" height="9" rx="0" fill="#008f9f" stroke="#00f2fe" stroke-width="0.5" />
      <rect x="407.5" y="103" width="9" height="9" rx="0" fill="#05070f" stroke="#1e293b" stroke-width="0.5" />
      <rect x="421.0" y="103" width="9" height="9" rx="0" fill="#05070f" stroke="#1e293b" stroke-width="0.5" />
      <rect x="434.5" y="103" width="9" height="9" rx="0" fill="#00f2fe" stroke="#00f2fe" stroke-width="0.5" />
      <rect x="448.0" y="103" width="9" height="9" rx="0" fill="#05070f" stroke="#1e293b" stroke-width="0.5" />
      <rect x="461.5" y="103" width="9" height="9" rx="0" fill="#05070f" stroke="#1e293b" stroke-width="0.5" />
      <rect x="475.0" y="103" width="9" height="9" rx="0" fill="#008f9f" stroke="#00f2fe" stroke-width="0.5" />
      <rect x="488.5" y="103" width="9" height="9" rx="0" fill="#05070f" stroke="#1e293b" stroke-width="0.5" />
      <rect x="502.0" y="103" width="9" height="9" rx="0" fill="#05070f" stroke="#1e293b" stroke-width="0.5" />
      <rect x="515.5" y="103" width="9" height="9" rx="0" fill="#00f2fe" stroke="#00f2fe" stroke-width="0.5" />
      <rect x="529.0" y="103" width="9" height="9" rx="0" fill="#05070f" stroke="#1e293b" stroke-width="0.5" />
      <rect x="542.5" y="103" width="9" height="9" rx="0" fill="#05070f" stroke="#1e293b" stroke-width="0.5" />
      <rect x="556.0" y="103" width="9" height="9" rx="0" fill="#0d5c75" stroke="#00f2fe" stroke-width="0.5" />
      <rect x="569.5" y="103" width="9" height="9" rx="0" fill="#05070f" stroke="#1e293b" stroke-width="0.5" />
      <rect x="583.0" y="103" width="9" height="9" rx="0" fill="#05070f" stroke="#1e293b" stroke-width="0.5" />
      <rect x="596.5" y="103" width="9" height="9" rx="0" fill="#008f9f" stroke="#00f2fe" stroke-width="0.5" />
      <rect x="610.0" y="103" width="9" height="9" rx="0" fill="#05070f" stroke="#1e293b" stroke-width="0.5" />
      <rect x="623.5" y="103" width="9" height="9" rx="0" fill="#05070f" stroke="#1e293b" stroke-width="0.5" />
      <rect x="637.0" y="103" width="9" height="9" rx="0" fill="#0d5c75" stroke="#00f2fe" stroke-width="0.5" />
      <rect x="650.5" y="103" width="9" height="9" rx="0" fill="#05070f" stroke="#1e293b" stroke-width="0.5" />
      <rect x="664.0" y="103" width="9" height="9" rx="0" fill="#05070f" stroke="#1e293b" stroke-width="0.5" />
      <rect x="677.5" y="103" width="9" height="9" rx="0" fill="#008f9f" stroke="#00f2fe" stroke-width="0.5" />
      <rect x="691.0" y="103" width="9" height="9" rx="0" fill="#008f9f" stroke="#00f2fe" stroke-width="0.5" />
      <rect x="704.5" y="103" width="9" height="9" rx="0" fill="#008f9f" stroke="#00f2fe" stroke-width="0.5" />
      <rect x="718.0" y="103" width="9" height="9" rx="0" fill="#008f9f" stroke="#00f2fe" stroke-width="0.5" />
      <rect x="731.5" y="103" width="9" height="9" rx="0" fill="#05070f" stroke="#1e293b" stroke-width="0.5" />
      
      <!-- Legend -->
      <text x="750" y="110" font-size="7" font-weight="600" fill="#475569">Less</text>
      <rect x="772" y="103" width="8" height="8" rx="0" fill="#05070f" stroke="#1e293b" stroke-width="0.5" />
      <rect x="782" y="103" width="8" height="8" rx="0" fill="#0d5c75" stroke="#00f2fe" stroke-width="0.5" />
      <rect x="792" y="103" width="8" height="8" rx="0" fill="#008f9f" stroke="#00f2fe" stroke-width="0.5" />
      <rect x="802" y="103" width="8" height="8" rx="0" fill="#00f2fe" stroke="#00f2fe" stroke-width="0.5" />
      <rect x="812" y="103" width="8" height="8" rx="0" fill="#bd00ff" stroke="#d946ef" stroke-width="0.5" />
      <text x="825" y="110" font-size="7" font-weight="600" fill="#475569">More</text>
    </g>
  </g>
</svg>
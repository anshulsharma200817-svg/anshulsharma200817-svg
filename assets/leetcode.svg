<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 380" width="100%" height="100%">
  <defs>
    <!-- Fonts -->
    <style type="text/css">
      @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&amp;family=Fira+Code:wght@400;500&amp;display=swap');
      
      .status-card {
        font-family: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
      }
      
      .mono-text {
        font-family: 'Fira Code', monospace;
      }

      /* Glow Effects */
      .glow-neon-cyan {
        filter: drop-shadow(0 0 4px #00f2fe) drop-shadow(0 0 8px rgba(0, 242, 254, 0.3));
      }
      .glow-neon-emerald {
        filter: drop-shadow(0 0 3px #10b981) drop-shadow(0 0 6px rgba(16, 185, 129, 0.2));
      }
      .glow-neon-amber {
        filter: drop-shadow(0 0 3px #fbbf24) drop-shadow(0 0 6px rgba(251, 191, 36, 0.2));
      }
      .glow-neon-rose {
        filter: drop-shadow(0 0 3px #f43f5e) drop-shadow(0 0 6px rgba(244, 63, 94, 0.2));
      }

      /* Dial Segment Load Animations */
      @keyframes load-easy-arc {
        from { stroke-dasharray: 0 200; }
        to { stroke-dasharray: 25.06 200; } /* !lc_easy_dash */
      }
      @keyframes load-medium-arc {
        from { stroke-dasharray: 0 200; }
        to { stroke-dasharray: 24.46 200; } /* !lc_medium_dash */
      }
      @keyframes load-hard-arc {
        from { stroke-dasharray: 0 200; }
        to { stroke-dasharray: 1.79 200; } /* !lc_hard_dash */
      }

      /* Scanning Line animation */
      @keyframes scan-animation {
        0% { transform: translateY(0); opacity: 0; }
        5% { opacity: 0.8; }
        95% { opacity: 0.8; }
        100% { transform: translateY(370px); opacity: 0; }
      }

      /* Blinking corner dots */
      @keyframes blink {
        0%, 100% { opacity: 0.3; }
        50% { opacity: 1; }
      }

      /* Pulse core total */
      @keyframes pulse-core {
        0%, 100% { transform: scale(1); opacity: 0.95; }
        50% { transform: scale(1.02); opacity: 1; }
      }

      /* Classes */
      .bar-easy { animation: load-easy-arc 1.8s cubic-bezier(0.1, 0.8, 0.2, 1) forwards; }
      .bar-medium { animation: load-medium-arc 1.8s cubic-bezier(0.1, 0.8, 0.2, 1) forwards; }
      .bar-hard { animation: load-hard-arc 1.8s cubic-bezier(0.1, 0.8, 0.2, 1) forwards; }
      
      .scanner-line { animation: scan-animation 7s linear infinite; }
      .pulse-item { animation: blink 2s ease-in-out infinite; }
      .pulse-core { transform-origin: 60px 58px; animation: pulse-core 3s ease-in-out infinite; }
    </style>

    <!-- Background Grid -->
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#0e1322" stroke-width="0.8" />
    </pattern>

    <!-- Gradients -->
    <linearGradient id="card-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#04060c" />
      <stop offset="100%" stop-color="#080c16" />
    </linearGradient>

    <linearGradient id="bar-gradient-easy" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="bar-gradient-medium" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
    <linearGradient id="bar-gradient-hard" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#be123c" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>

    <filter id="scan-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Card Body -->
  <rect width="460" height="380" rx="2" fill="url(#card-bg)" stroke="#1e293b" stroke-width="1.5" />
  <rect width="460" height="380" rx="0" fill="url(#grid)" />
  
  <!-- Sharp Tech Borders -->
  <rect x="6" y="6" width="448" height="368" fill="none" stroke="#1e293b" stroke-width="1" />
  <rect x="9" y="9" width="442" height="362" fill="none" stroke="#334155" stroke-width="1" opacity="0.15" />

  <!-- Scanning HUD Line -->
  <line x1="7" y1="7" x2="453" y2="7" stroke="#00f2fe" stroke-width="1.5" class="scanner-line" filter="url(#scan-glow)" />

  <!-- Corner Blinking Dots -->
  <circle cx="12" cy="12" r="1.5" fill="#00f2fe" class="pulse-item" />
  <circle cx="448" cy="12" r="1.5" fill="#00f2fe" class="pulse-item" />
  <circle cx="12" cy="368" r="1.5" fill="#00f2fe" class="pulse-item" />
  <circle cx="448" cy="368" r="1.5" fill="#00f2fe" class="pulse-item" />

  <!-- Content Group -->
  <g class="status-card">
    
    <!-- Top Bar / Window Header -->
    <g transform="translate(20, 25)">
      <!-- System Title -->
      <text x="0" y="15" font-size="14" font-weight="800" fill="#f1f5f9" letter-spacing="3" class="mono-text">ALGORITHMIC RUNTIME // CONTEXT: LEETCODE</text>
      <!-- Subtitle -->
      <text x="0" y="30" font-size="9" font-weight="600" fill="#00f2fe" class="mono-text" letter-spacing="1">SYSTEM RUNTIME METRICS &amp; COMPETITIVE STANDARDS</text>
      
      <!-- Tech bracket corner -->
      <path d="M 405 2 L 420 2 L 420 17" fill="none" stroke="#00f2fe" stroke-width="1.5" opacity="0.8" />
    </g>

    <!-- Divider Line -->
    <line x1="20" y1="70" x2="440" y2="70" stroke="#1e293b" stroke-width="1" />

    <!-- Left Section: LeetCode Brand Crest -->
    <g transform="translate(20, 85)">
      <!-- Cyber Box for Emblem -->
      <rect width="110" height="110" fill="#060913" stroke="#1e293b" stroke-width="1.5" />
      <polygon points="4,4 12,4 4,12" fill="#00f2fe" />
      <polygon points="106,4 98,4 106,12" fill="#00f2fe" />
      <polygon points="4,106 12,106 4,98" fill="#00f2fe" />
      <polygon points="106,106 98,106 106,98" fill="#00f2fe" />

      <!-- Glowing LeetCode Logo -->
      <g transform="translate(24, 20) scale(0.65)">
        <path d="M67.506,83.066 C70.000,80.576 74.037,80.582 76.522,83.080 C79.008,85.578 79.002,89.622 76.508,92.112 L65.435,103.169 C55.219,113.370 38.560,113.518 28.172,103.513 C28.112,103.455 23.486,98.920 8.227,83.957 C-1.924,74.002 -2.936,58.074 6.616,47.846 L24.428,28.774 C33.910,18.621 51.387,17.512 62.227,26.278 L78.405,39.362 C81.144,41.577 81.572,45.598 79.361,48.342 C77.149,51.087 73.135,51.515 70.395,49.300 L54.218,36.217 C48.549,31.632 38.631,32.262 33.739,37.500 L15.927,56.572 C11.277,61.552 11.786,69.574 17.146,74.829 C28.351,85.816 36.987,94.284 36.997,94.294 C42.398,99.495 51.130,99.418 56.433,94.123 L67.506,83.066 Z" fill="#ffa116" />
        <path d="M49.412,2.023 C51.817,-0.552 55.852,-0.686 58.423,1.722 C60.994,4.132 61.128,8.173 58.723,10.749 L15.928,56.572 C11.277,61.551 11.786,69.573 17.145,74.829 L36.909,94.209 C39.425,96.676 39.468,100.719 37.005,103.240 C34.542,105.760 30.506,105.804 27.990,103.336 L8.226,83.956 C-1.924,74.002 -2.936,58.074 6.617,47.846 L49.412,2.023 Z" fill="#f3f4f6" />
        <path d="M40.606,72.001 C37.086,72.001 34.231,69.142 34.231,65.614 C34.231,62.087 37.086,59.228 40.606,59.228 L87.624,59.228 C91.145,59.228 94,62.087 94,65.614 C94,69.142 91.145,72.001 87.624,72.001 L40.606,72.001 Z" fill="#b3b3b3" />
      </g>
      
      <!-- Logo Label below -->
      <text x="55" y="94" font-size="8" font-weight="700" fill="#475569" text-anchor="middle" letter-spacing="1">LEETCODE</text>
    </g>

    <!-- Right Section: General Stats & Info -->
    <g transform="translate(150, 85)">
      <!-- Username -->
      <text x="0" y="16" font-size="12" font-weight="600" fill="#475569">HANDLE:</text>
      <text x="75" y="16" font-size="14" font-weight="700" fill="#f8fafc" class="mono-text">anshulsharma_</text>

      <!-- Global Rank -->
      <text x="0" y="36" font-size="12" font-weight="600" fill="#475569">RANK:</text>
      <text id="lc-rank" x="75" y="36" font-size="13" font-weight="700" fill="#f1f5f9" class="mono-text">#1,870,002</text>

      <!-- Combat Class based on stats -->
      <text x="0" y="56" font-size="12" font-weight="600" fill="#475569">SOLVER:</text>
      <text id="lc-solver" x="75" y="56" font-size="13" font-weight="800" fill="#00f2fe" class="glow-neon-cyan" letter-spacing="1">MID-TIER CODER</text>

      <!-- Skill Guild/Affiliation -->
      <text x="0" y="76" font-size="12" font-weight="600" fill="#475569">FOCUS:</text>
      <text x="75" y="76" font-size="12" font-weight="600" fill="#3b82f6">Algorithms &amp; Logic</text>

      <!-- Quest Status -->
      <text x="0" y="96" font-size="12" font-weight="600" fill="#475569">MISSION:</text>
      <text x="75" y="96" font-size="11" font-weight="700" fill="#fb923c" class="mono-text">[ SECURING CORE ]</text>
    </g>

    <!-- Divider Line -->
    <line x1="20" y1="210" x2="440" y2="210" stroke="#1e293b" stroke-width="1" />

    <!-- Bottom Section: Circular Gauge Wheel & Stacked Progress Cards -->
    <g transform="translate(20, 216)">
      
      <!-- Left Sub-Section: Solved Gauge Wheel -->
      <g transform="translate(10, 10)">
        <!-- Background track arc (circumference ~ 239px, 270 degree arc = 179px, gap = 60px) -->
        <path d="M 33.2 81.8 A 38 38 0 1 1 86.8 81.8" fill="none" stroke="#05070f" stroke-width="5" stroke-linecap="butt" />
        
        <!-- Easy Arc segment (length 30px, offset 0px) -->
        <path d="M 33.2 81.8 A 38 38 0 1 1 86.8 81.8" fill="none" stroke="url(#bar-gradient-easy)" stroke-width="5.5" stroke-linecap="butt" stroke-dasharray="30 200" stroke-dashoffset="0" class="bar-easy glow-neon-emerald" />
        
        <!-- Medium Arc segment (length 30px, offset -30px) -->
        <path id="lc-medium-arc" d="M 33.2 81.8 A 38 38 0 1 1 86.8 81.8" fill="none" stroke="url(#bar-gradient-medium)" stroke-width="5.5" stroke-linecap="butt" stroke-dasharray="30 200" stroke-dashoffset="-25" class="bar-medium glow-neon-amber" />
        
        <!-- Hard Arc segment (length 7px, offset -60px) -->
        <path id="lc-hard-arc" d="M 33.2 81.8 A 38 38 0 1 1 86.8 81.8" fill="none" stroke="url(#bar-gradient-hard)" stroke-width="5.5" stroke-linecap="butt" stroke-dasharray="7 200" stroke-dashoffset="-49" class="bar-hard glow-neon-rose" />
        
        <!-- Solved gauge text elements inside -->
        <g class="pulse-core">
          <text x="60" y="49" text-anchor="middle">
            <tspan id="lc-solved" font-size="20" font-weight="800" fill="#f1f5f9">86</tspan>
            <tspan id="lc-total" font-size="10" font-weight="500" fill="#475569">/4051</tspan>
          </text>
          <text x="60" y="63" font-size="9" font-weight="500" fill="#475569" text-anchor="middle" letter-spacing="1">SOLVED</text>
          <text id="lc-attempting" x="60" y="79" font-size="7" font-weight="700" fill="#10b981" text-anchor="middle" class="mono-text">3 Active</text>
        </g>
      </g>

      <!-- Right Sub-Section: Difficulty Stacked Cards (Easy, Medium, Hard) -->
      <g transform="translate(140, 10)">
        <!-- Easy Card -->
        <g transform="translate(0, 0)">
          <rect x="0" y="0" width="280" height="28" fill="#05070f" stroke="#1e293b" stroke-width="1" />
          <rect x="0" y="0" width="4" height="28" fill="#10b981" />
          <text x="15" y="18" font-size="11" font-weight="700" fill="#10b981" class="glow-neon-emerald">Easy</text>
          <text id="lc-easy-count" x="265" y="18" font-size="11" font-weight="700" fill="#f1f5f9" class="mono-text" text-anchor="end">42 <tspan fill="#475569" font-size="10">/ 964</tspan></text>
        </g>

        <!-- Medium Card -->
        <g transform="translate(0, 34)">
          <rect x="0" y="0" width="280" height="28" fill="#05070f" stroke="#1e293b" stroke-width="1" />
          <rect x="0" y="0" width="4" height="28" fill="#fbbf24" />
          <text x="15" y="18" font-size="11" font-weight="700" fill="#fbbf24" class="glow-neon-amber">Medium</text>
          <text id="lc-medium-count" x="265" y="18" font-size="11" font-weight="700" fill="#f1f5f9" class="mono-text" text-anchor="end">41 <tspan fill="#475569" font-size="10">/ 2113</tspan></text>
        </g>

        <!-- Hard Card -->
        <g transform="translate(0, 68)">
          <rect x="0" y="0" width="280" height="28" fill="#05070f" stroke="#1e293b" stroke-width="1" />
          <rect x="0" y="0" width="4" height="28" fill="#f43f5e" />
          <text x="15" y="18" font-size="11" font-weight="700" fill="#f43f5e" class="glow-neon-rose">Hard</text>
          <text id="lc-hard-count" x="265" y="18" font-size="11" font-weight="700" fill="#f1f5f9" class="mono-text" text-anchor="end">3 <tspan fill="#475569" font-size="10">/ 974</tspan></text>
        </g>
      </g>
      
    </g>

  </g>
</svg>
